[project]
name = "echo-mcp"
version = "0.1.0"
description = "Explainable time-series anomaly and pattern detection via the Matrix Profile algorithm. Exposed as an MCP server."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.9.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "black>=24.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "radon>=6.0.0",
]

[project.scripts]
echo-mcp = "echo.presentation.mcp_server:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
echo = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["echo"]
omit = [
    "martin_*.py",
    "tests/*",
]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.black]
target-version = ["py314"]
